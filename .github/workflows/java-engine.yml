# CI for the Java engine (engines/). Separate from ci.yml on purpose: it only runs when the engine
# changes, so the Node/SaaS pipeline is never touched by it.

name: Java engine

on:
  pull_request:
    branches: [main]
    paths: ["engines/**", ".github/workflows/java-engine.yml"]
  push:
    branches: [main]
    paths: ["engines/**", ".github/workflows/java-engine.yml"]

permissions:
  contents: read

concurrency:
  group: java-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway values for CI only.
  TEST_MASTER_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

jobs:
  build:
    name: Build, test against PostgreSQL / MySQL / MariaDB, coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: engine, POSTGRES_PASSWORD: engine, POSTGRES_DB: engine }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U engine" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: rootpw }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -prootpw --silent" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11.4
        env: { MARIADB_ROOT_PASSWORD: rootpw }
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
      gotenberg:
        image: gotenberg/gotenberg:8
        ports: ["3000:3000"]
        options: >-
          --health-cmd "curl -sf http://localhost:3000/health" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CURF_ENGINE_TEST_GOTENBERG_URL: http://localhost:3000
      CURF_ENGINE_DB_URL: jdbc:postgresql://localhost:5432/engine
      CURF_ENGINE_DB_USER: engine
      CURF_ENGINE_DB_PASSWORD: engine
      CURF_ENGINE_TEST_MYSQL_HOST: localhost
      CURF_ENGINE_TEST_MYSQL_PORT: "3306"
      CURF_ENGINE_TEST_MARIADB_HOST: localhost
      CURF_ENGINE_TEST_MARIADB_PORT: "3307"
      CURF_ENGINE_TEST_ROOT_PASSWORD: rootpw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Check (tests, ArchUnit, JaCoCo >= 80%)
        working-directory: engines/java
        run: gradle check --no-daemon

  contract:
    name: Contract lint and breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Spectral
        working-directory: engines/contracts
        run: npx -y @stoplight/spectral-cli@6 lint engine-v1.openapi.yaml --ruleset .spectral.yaml --fail-severity error
      - name: oasdiff against the base branch
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:engines/contracts/engine-v1.openapi.yaml" > /tmp/base.yaml 2>/dev/null || { echo "no base contract yet"; exit 0; }
          docker run --rm -v /tmp/base.yaml:/base.yaml -v "$PWD/engines/contracts/engine-v1.openapi.yaml:/new.yaml" \
            tufin/oasdiff breaking /base.yaml /new.yaml --fail-on ERR

  image-and-conformance:
    name: Image runs non-root and passes the conformance suite
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: engine, POSTGRES_PASSWORD: engine, POSTGRES_DB: engine }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U engine" --health-interval 5s --health-timeout 5s --health-retries 10
      gotenberg:
        image: gotenberg/gotenberg:8
        ports: ["3000:3000"]
        options: >-
          --health-cmd "curl -sf http://localhost:3000/health" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare the database the suite will query
        env:
          PGPASSWORD: engine
        run: |
          psql -h localhost -U engine engine -f engines/conformance/fixtures/agency_data.sql
          psql -h localhost -U engine engine <<'SQL'
          create table guard_probe(id int primary key, label varchar(50));
          insert into guard_probe values (1,'one'),(2,'two'),(3,'three');
          create role curf_writer login password 'Pw-conformance-1';
          create role curf_reader login password 'Pw-conformance-1';
          grant all on guard_probe, agency_data to curf_writer;
          grant create on schema public to curf_writer;
          grant select on guard_probe, agency_data to curf_reader;
          SQL
      - name: Start the stand-in identity provider
        working-directory: engines/conformance
        run: |
          node tools/mock-idp.mjs --port 9099 > /tmp/idp.log 2>&1 &
          for i in $(seq 1 15); do curl -sf localhost:9099/jwks >/dev/null && break; sleep 1; done
      - name: Build image
        run: docker build -t curf-engine:ci engines/java
      - name: Start the engine
        run: |
          docker run -d --name engine --network host \
            -e CURF_ENGINE_DB_URL=jdbc:postgresql://localhost:5432/engine \
            -e CURF_ENGINE_DB_USER=engine -e CURF_ENGINE_DB_PASSWORD=engine \
            -e CURF_ENGINE_MASTER_KEY=${TEST_MASTER_KEY} \
            -e CURF_ENGINE_SECURITY_ISSUERS_0_ISSUER=https://idp.test/realms/main \
            -e CURF_ENGINE_SECURITY_ISSUERS_0_JWKSETURI=http://localhost:9099/jwks \
            -e CURF_ENGINE_SECURITY_CLAIMS_TENANT=tenant \
            -e CURF_ENGINE_SECURITY_CLAIMS_ATTRIBUTES_0=agency_code \
            -e CURF_ENGINE_CONNECTIONS_ALLOW_LOOPBACK=true \
            -e CURF_ENGINE_GOTENBERG_URL=http://localhost:3000 \
            -e CURF_ENGINE_SCHEDULES_ALLOWED_RECIPIENT_DOMAINS_0=example.test \
            curf-engine:ci
          for i in $(seq 1 40); do curl -sf localhost:8080/engine/v1/actuator/health && break; sleep 2; done
      - name: Runs as non-root
        run: test "$(docker exec engine id -u)" != "0"
      - name: Refuses to start without a master key
        run: |
          if docker run --rm --network host \
            -e CURF_ENGINE_DB_URL=jdbc:postgresql://localhost:5432/engine -e CURF_ENGINE_DB_USER=engine -e CURF_ENGINE_DB_PASSWORD=engine \
            -e CURF_ENGINE_SECURITY_ISSUERS_0_ISSUER=https://idp.test/realms/main \
            -e CURF_ENGINE_SECURITY_ISSUERS_0_JWKSETURI=http://localhost:9099/jwks \
            -e SERVER_PORT=8089 curf-engine:ci; then echo "started without a key"; exit 1; fi
      - name: Conformance
        working-directory: engines/conformance
        run: |
          export ENGINE_URL=http://localhost:8080/engine/v1
          export ENGINE_IDP_URL=http://localhost:9099
          export ENGINE_PDF=1
          export ENGINE_TOKEN_ADMIN=$(curl -s "localhost:9099/token?sub=admin&tenant=ci&roles=curf-admin")
          export ENGINE_TOKEN_VIEWER=$(curl -s "localhost:9099/token?sub=viewer&tenant=ci&roles=curf-viewer")
          export ENGINE_TARGET_KIND=POSTGRESQL ENGINE_TARGET_HOST=localhost ENGINE_TARGET_PORT=5432 ENGINE_TARGET_DATABASE=engine
          export ENGINE_TARGET_WRITER_USER=curf_writer ENGINE_TARGET_READER_USER=curf_reader ENGINE_TARGET_PASSWORD=Pw-conformance-1
          npm test
      - name: Engine logs on failure
        if: failure()
        run: docker logs engine | tail -100
